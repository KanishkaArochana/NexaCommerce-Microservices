spring.application.name=inventory-service

# Automatically import local .env file if it exists (using Java properties syntax)
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8083}

# Database credentials read directly from environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:inventory_db}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
