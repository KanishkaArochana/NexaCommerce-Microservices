spring.application.name=api-gateway

# Automatically import local .env file if it exists
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# Route 1: Product Service
spring.cloud.gateway.server.webmvc.routes[0].id=product-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://${PRODUCT_SERVICE_HOST:localhost}:${PRODUCT_SERVICE_PORT:8082}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/products/**

# Route 2: Inventory Service
spring.cloud.gateway.server.webmvc.routes[1].id=inventory-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://${INVENTORY_SERVICE_HOST:localhost}:${INVENTORY_SERVICE_PORT:8083}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/inventory/**

# Route 3: User Service (Users & Auth endpoints)
spring.cloud.gateway.server.webmvc.routes[2].id=user-service
spring.cloud.gateway.server.webmvc.routes[2].uri=http://${USER_SERVICE_HOST:localhost}:${USER_SERVICE_PORT:8084}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/users/**,/api/v1/auth/**

# Route 4: Order Service
spring.cloud.gateway.server.webmvc.routes[3].id=order-service
spring.cloud.gateway.server.webmvc.routes[3].uri=http://${ORDER_SERVICE_HOST:localhost}:${ORDER_SERVICE_PORT:8085}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/orders/**

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=${HEALTH_DETAILS:when-authorized}
